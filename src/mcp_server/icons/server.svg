  <rect x="3" y="14" width="18" height="7" rx="2"/>
  <circle cx="7" cy="6.5" r="0.5" fill="#6366f1"/>
  <circle cx="7" cy="17.5" r="0.5" fill="#6366f1"/>
</svg>
