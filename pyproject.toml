[project]
name = "research-mcp"
version = "0.1.0"
description = "General-purpose MCP server (FastMCP, streamable HTTP, no auth) used as a subject of network-level and security research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khalil El Kaaki", email = "khalil.el.kaaki@gmail.com" }]
dependencies = [
    "fastmcp>=4.0",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.scripts]
research-mcp = "mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mcp_server",
    "src/files",
    "src/sqlite_db",
    "src/http_api",
    "src/netdiag",
    "src/security",
    "src/memory",
    "src/commands",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: test requires internet access (deselect with -m 'not network')"]
